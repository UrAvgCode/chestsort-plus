# ===============================
# Chestsort+ Plugin Configuration
# ===============================

config:
  # current plugin version, do not change this
  version: ${version}

categories:
  # load categories from external yaml files
  # external categories are not automatically updated
  external: false

  # the order in which categories are sorted
  order:
    - combat
    - tools_and_utilities
    - food_and_drinks
    - ingredients
    - spawn_eggs
    - building_blocks
    - colored_blocks
    - natural_blocks
    - functional_blocks
    - redstone_blocks
    - op_blocks
